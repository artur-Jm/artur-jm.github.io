<style>
  :root{
    --bg:#181815;
    --card:#232320;
    --card-2:#2b2b27;
    --line:#38382f;
    --amber:#ff8a3d;
    --teal:#2dd9b9;
    --teal-dim:#1d5f52;
    --text:#f4f1e8;
    --muted:#9a9686;
    --danger:#e8604c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  .display{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:0.02em;}

  header{
    padding:26px 20px 16px; text-align:center;
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:24px; font-weight:700; margin:0;}

  main{max-width:480px; margin:0 auto; padding:24px 18px 60px;}

  .progress-wrap{margin-bottom:22px; text-align:center;}
  .progress-wrap .num{font-size:15px; color:var(--muted);}
  .bar{height:8px; background:var(--card-2); border-radius:4px; overflow:hidden; margin-top:10px;}
  .bar-fill{height:100%; background:var(--teal); border-radius:4px; transition:width .4s ease;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:22px 20px; text-align:center;
  }
  .card img{
    width:150px; height:150px; object-fit:cover; border-radius:14px;
    background:var(--card-2); margin-bottom:18px;
  }
  .card .titulo{
    font-size:18px; font-weight:600; line-height:1.35; margin-bottom:26px;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }

  button{
    font-family:'Inter',sans-serif; font-weight:700; border:none; border-radius:14px;
    cursor:pointer; width:100%; padding:18px 16px; font-size:17px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .1s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber); color:#241203;}
  .btn-secondary{background:var(--teal); color:#062420; margin-top:14px;}
  .btn-secondary:disabled{opacity:.45; cursor:default;}
  .btn-text{
    background:none; color:var(--muted); font-weight:500; font-size:14px;
    padding:12px; margin-top:6px; text-decoration:underline;
  }

  .passo{font-size:13px; color:var(--muted); margin:16px 0 4px; text-align:center;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--teal); color:#062420; font-weight:600; font-size:14px;
    padding:12px 20px; border-radius:30px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, bottom .25s ease;
  }
  .toast.show{opacity:1; bottom:34px;}
  .toast.err{background:var(--danger); color:#2a0a05;}

  .done-box{
    background:var(--card); border:1px solid var(--teal-dim); border-radius:20px;
    padding:40px 20px; text-align:center;
  }
  .done-box .big{font-size:44px; margin-bottom:8px;}
  .done-box .display{font-size:24px; margin-bottom:6px;}
  .done-box p{color:var(--muted); font-size:14px; margin:0;}

  footer{
    text-align:center; margin-top:34px;
  }
  footer button{width:auto; display:inline-flex;}

  .loading{padding:80px 20px; text-align:center; color:var(--muted); font-size:14px;}
  .hidden{display:none !important;}
</style>
</head>

</main>

  const KEY = 'fila-links-vagner-v2';
  let estado = null;

  async function carregarEstado(){
    try {
      const r = await window.storage.get(KEY, true);
      estado = JSON.parse(r.value);
    } catch (e) {
      estado = { produtos: PRODUTOS_EMBUTIDOS.map(p => ({ ...p, status: 'pendente', linkAfiliado: null })) };
      await salvarEstado();
    }
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('tela-principal').classList.remove('hidden');
    renderizarTudo();
  }

  async function salvarEstado(){
    try {
      await window.storage.set(KEY, JSON.stringify(estado), true);
    } catch (e) {
      console.error('Erro ao salvar', e);
    }
  }

  function proximoPendenteIndex(){
    return estado.produtos.findIndex(p => p.status === 'pendente');
  }

  function renderizarTudo(){
    const total = estado.produtos.length;
    const concluidos = estado.produtos.filter(p => p.status === 'concluido').length;

    document.getElementById('qtd-total').textContent = total;
    document.getElementById('qtd-concluidos').textContent = concluidos;
    document.getElementById('barra-progresso').style.width = (total ? (concluidos/total*100) : 0) + '%';

    const idx = proximoPendenteIndex();
    const cartao = document.getElementById('cartao-produto');
    const telaConcluido = document.getElementById('tela-concluido');

    if (idx === -1) {
      cartao.innerHTML = '';
      telaConcluido.classList.remove('hidden');
    } else {
      telaConcluido.classList.add('hidden');
      renderizarCartao(idx);
    }
  }

  function renderizarCartao(idx){
    const p = estado.produtos[idx];
    document.getElementById('cartao-produto').innerHTML = `
      <div class="card">
        ${p.imagem ? `<img src="${escapeAttr(p.imagem)}" alt="">` : ''}
        <div class="titulo">${escapeHtml(p.titulo)}</div>
        <a href="${escapeAttr(p.linkBruto)}" target="_blank" rel="noopener" style="text-decoration:none; display:block;">
          <button class="btn-primary">1. Abrir no Mercado Livre</button>
        </a>
        <div class="passo">Lá no app, toque em "Compartilhar" e depois em "Copiar link"</div>
        <button class="btn-secondary" id="btn-salvar" onclick="colarESalvar(${idx})">2. Colei o link, salvar</button>
      </div>
    `;
  }

  async function colarESalvar(idx){
    const btn = document.getElementById('btn-salvar');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    let texto = '';
    try {
      texto = await navigator.clipboard.readText();
    } catch (e) {
      mostrarToast('Não consegui ler a área de transferência. Copie o link de novo e tente mais uma vez.', true);
      btn.disabled = false;
      btn.textContent = '2. Colei o link, salvar';
      return;
    }

    texto = (texto || '').trim();
    if (!texto || !/mercadolivre\.com|meli\.la/i.test(texto)) {
      mostrarToast('Não encontrei um link do Mercado Livre copiado. Copie de novo e tente.', true);
      btn.disabled = false;
      btn.textContent = '2. Colei o link, salvar';
      return;
    }

    estado.produtos[idx].status = 'concluido';
    estado.produtos[idx].linkAfiliado = texto;
    await salvarEstado();
    mostrarToast('Salvo! Próximo produto...');
    setTimeout(() => renderizarTudo(), 500);
  }

  function mostrarToast(msg, erro){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (erro ? ' err' : '');
    setTimeout(() => { t.className = 'toast' + (erro ? ' err' : ''); }, 2600);
  }

  function baixarBackup(){
    const resultado = {};
    estado.produtos.filter(p => p.status === 'concluido').forEach(p => {
      resultado[p.id_produto] = p.linkAfiliado;
    });
    const blob = new Blob([JSON.stringify(resultado, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'links-salvos.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function escapeAttr(str){
    return (str || '').replace(/"/g, '&quot;');
  }

  carregarEstado();
</script>
